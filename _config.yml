title: "SUNY Poly AI FYE"
description: >
  SUNY Poly experience combining FYS 111 -- first year seminiar -- with COM 216, using AI to examine the history of human communication.
baseurl: ""
url: "https://sunypoly-com216-fall26.github.io"
author: "Steven M. Schneider"
email: "steves@sunypoly.edu"

# Build settings
markdown: kramdown
theme: minima

# Collections
collections:
  tabs3:
    output: false
  tabs2:
    output: false
  conversations:
    output: true
    permalink: /conversations/:name/
  bib:
    output: false

defaults:
  - scope:
      path: ""
      type: conversations
    values:
      layout: conversation

# Exclude non-content files from build
exclude:
  - "*.DS_Store"
  - "shared/lit-review/*.bib"
  - "lit-rev-v0"
  - "_bib/*.bib"
