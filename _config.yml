title: "SUNY Poly AI FYE"
description: >
  SUNY Poly experience combining FYS 111 -- first year seminar -- with COM 216,
  using AI to examine the history of human communication.
baseurl: ""
url: "https://sunypoly-com216-fall26.github.io"
author: "Steven M. Schneider"
email: "steves@sunypoly.edu"

# Build settings
markdown: kramdown
remote_theme: mmistacks/minimal-mistakes@4.26.2
minimal_mistakes_skin: suny-poly-aix

# Plugins (required for remote_theme on GitHub Pages)
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  tabs2:
    output: false
  conversations:
    output: true
    permalink: /conversations/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: conversations
    values:
      layout: conversation

# Exclude non-content files from build
exclude:
  - "*.DS_Store"
  - "shared/lit-review/*.bib"
  - "lit-rev-v0"
  - Gemfile
  - Gemfile.lock
  - vendor
