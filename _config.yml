title: "SUNY Poly AI FYE"
description: >
  SUNY Poly experience combining FYS 111 -- first year seminar -- with COM 216,
  using AI to examine the history of human communication.
baseurl: ""
url: "https://sunypoly-com216-fall26.github.io"
author: "Steven M. Schneider"
email: "steves@sunypoly.edu"

# HOW THIS SITE IS PUBLISHED
# Push content to `main` and .github/workflows/build.yml builds the site with
# Jekyll 4 on Ruby 3.4 and deploys it to GitHub Pages. There is no build step
# for a human to run and no generated output committed to this repo.
# Local `rake preview` is optional and affects nothing that gets published.
#
# Build settings
# No theme gem: index.html is self-contained (layout: null) and the
# conversations collection would use the local _layouts/page.html.
markdown: kramdown

# Collections
# tabs3 is the set the live site renders (index.html sorts site.tabs3 by
# "order"). The earlier tab sets stay declared so their files are read but
# not published as standalone pages.
collections:
  tabs3:
    output: false
  tabs2:
    output: false
  tabs11:
    output: false
  tabs1:
    output: false
  conversations:
    output: true
    permalink: /conversations/:name/
  bib:
    output: false

defaults:
  - scope:
      path: ""
      type: conversations
    values:
      layout: page

# Exclude non-content files from build
exclude:
  - .DS_Store
  - "*.DS_Store"
  - "shared/lit-review/*.bib"
  - "lit-rev-v0"
  - "_bib/*.bib"
  - Gemfile
  - Gemfile.lock
  - vendor
  - Rakefile
  - README.md
  - SETUP.md
