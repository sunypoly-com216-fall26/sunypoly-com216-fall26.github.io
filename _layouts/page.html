<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { max-width: 44rem; margin: 3rem auto; padding: 0 1.25rem; color: #333;
           font: 400 1rem/1.65 "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif; }
    h1, h2, h3 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; line-height: 1.2; }
    h1 { font-size: 1.9rem; margin-bottom: .5rem; }
    h3 { margin-top: 2.25rem; color: #666; font-size: 1.15rem; }
    a { color: #333; }
    hr { border: 0; border-top: 1px solid #ddd; margin: 2rem 0; }
    code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
    pre { background: #f6f6f6; padding: 1rem; overflow-x: auto; }
    blockquote { margin: 1.5rem 0; padding-left: 1rem; border-left: 2px solid #ccc; color: #666; }
    .back { display: inline-block; margin-bottom: 2.5rem; font-size: .875rem; color: #666; text-decoration: none; }
  </style>
</head>
<body>
  <a class="back" href="{{ '/' | relative_url }}">&larr; {{ site.title }}</a>
  {{ content }}
</body>
</html>
